<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI and Agents Concept</title>
  <desc id="desc">Stylized illustration showing a network of nodes connected to a central AI core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="core" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="node" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="320" cy="180" r="90" fill="url(#core)" opacity="0.25"/>
  <circle cx="320" cy="180" r="60" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 6"/>
  <circle cx="320" cy="180" r="32" fill="url(#core)" stroke="#0ea5e9" stroke-width="2"/>
  <text x="320" y="186" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">AI Core</text>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="320" y1="180" x2="140" y2="80"/>
    <line x1="320" y1="180" x2="520" y2="100"/>
    <line x1="320" y1="180" x2="520" y2="260"/>
    <line x1="320" y1="180" x2="140" y2="260"/>
    <line x1="320" y1="180" x2="320" y2="40"/>
    <line x1="320" y1="180" x2="320" y2="320"/>
  </g>
  <g fill="url(#node)" stroke="#c4b5fd" stroke-width="2">
    <circle cx="140" cy="80" r="22"/>
    <circle cx="520" cy="100" r="22"/>
    <circle cx="520" cy="260" r="22"/>
    <circle cx="140" cy="260" r="22"/>
    <circle cx="320" cy="40" r="22"/>
    <circle cx="320" cy="320" r="22"/>
  </g>
  <g fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    <text x="140" y="84">Security</text>
    <text x="520" y="104">Automation</text>
    <text x="520" y="264">Data</text>
    <text x="140" y="264">Privacy</text>
    <text x="320" y="44">Agents</text>
    <text x="320" y="324">Users</text>
  </g>
</svg>
